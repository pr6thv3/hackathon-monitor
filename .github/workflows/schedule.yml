name: Scheduled Hackathon & Opportunity Intelligence Agent

on:
  schedule:
    # Practical periodic schedule: Twice weekly on Monday & Thursday at 8:00 AM UTC (1:30 PM IST)
    # - Monday: New weekly openings, launches, and priority planning
    # - Thursday: Weekend hackathon deadlines, registration cutoffs, and final calls
    #
    # Easy schedule modifications (just edit the cron expression below):
    #   - '0 8 * * 1'      -> Weekly on Mondays
    #   - '0 8 * * 1,4'    -> Twice weekly (Monday & Thursday) [Recommended]
    #   - '0 8 */3 * *'    -> Every 3 days
    #   - '0 8 */5 * *'    -> Every 5 days
    - cron: '0 8 * * 1,4'
  workflow_dispatch: {}     # Enables manual on-demand execution from GitHub UI

jobs:
  monitor_and_notify:
    name: Run Intelligence Pipeline & Dispatch Progress Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write    # Required for auto-committing seen_events.json deduplication memory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Execute Opportunity Intelligence Pipeline & Dispatch Alerts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIT_USERNAME: ${{ secrets.VIT_USERNAME }}
          VIT_PASSWORD: ${{ secrets.VIT_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Generate GitHub Actions Step Summary & Progress Digest
        if: always()
        run: |
          echo "# 🎯 Hackathon Monitor v4 — Workflow Execution Digest" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $(date -u) (UTC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Project Status & Git Health" >> $GITHUB_STEP_SUMMARY
          python -c "from src.git_status import get_project_status_summary; print(get_project_status_summary())" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 System Metrics" >> $GITHUB_STEP_SUMMARY
          python main.py --stats >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Top Active Opportunities & Deadlines" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python main.py --list-events >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit & Push Deduplication Memory Updates
        if: success()
        run: |
          git config user.name "hackathon-bot"
          git config user.email "bot@hackathon-monitor"
          git add seen_events.json
          git diff --cached --quiet || git commit -m "🤖 Update seen_events.json deduplication memory [skip ci]"
          git pull --rebase origin main
          git push
